name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Every day: catches a new Claude Desktop release that breaks profiles.
    - cron: "23 1 * * *"

permissions:
  contents: read

jobs:
  commit-format:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit must be "<emoji> <type>: <message>"
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then range="$AFTER^!"
          else range="$BEFORE..$AFTER"; fi
          status=0
          for c in $(git rev-list --no-merges "$range"); do
            if ./scripts/check-commit-msg.sh -m "$(git log -1 --format=%B "$c")"; then
              echo "ok   $(git log -1 --format='%h %s' "$c")"
            else
              status=1
            fi
          done
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x claude-dual scripts/*.sh .githooks/commit-msg tests/*.sh
      - name: unit tests
        run: bash tests/unit.sh && bash tests/commit-msg.sh

  macos:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests with macOS bash 3.2
        run: /bin/bash --version | head -1 && /bin/bash tests/unit.sh && /bin/bash tests/commit-msg.sh

      - name: Install latest Claude Desktop
        run: |
          brew update >/dev/null || true
          brew install --cask claude
          # CI only: skip the first-launch "downloaded from the Internet" dialog
          xattr -dr com.apple.quarantine /Applications/Claude.app || true
          echo "Claude $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Claude.app/Contents/Info.plist)"

      - name: End-to-end (two profiles side by side)
        run: /bin/bash tests/e2e-macos.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-artifacts/
          if-no-files-found: ignore
